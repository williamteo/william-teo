  - id: workshop
    title: Workshop Papers
    blurb: Refereed but non-archival. The arXiv version is the citable copy.
    items:
      - title: "Pairwise Approximation Can Select the Wrong Multi-Robot Plan"
        authors:
          - name: "William Wei Jie Teo"
            me: true
        venue: "IROS 2026 Workshop on Intelligent Information Gathering"
        year: 2026
        summary: >-
          Many multi-robot coordination methods score a joint plan from singleton and
          pairwise terms. Replaying every robot subset of recorded four-robot exploration
          plans shows that the pairwise score picks a different plan from the exact score
          on six of seven maps at a 15 m range, losing up to a third of the map's coverage.
        keywords:
          - multi-robot systems
          - multi-robot exploration
          - coordination
          - set function approximation
          - Möbius decomposition
        links:
          - label: Project
            url: "https://www.william-teo.com/pairwise-regret/"
          - label: arXiv
            url: "https://arxiv.org/abs/2609.29929"
          - label: Code
            url: "https://github.com/williamteo/pairwise-regret"

  - id: thesis
    title: Thesis
    items:
      - title: "A natural language processing approach to improve demand forecasting in long supply chains"
        authors:
          - name: "William Wei Jie Teo"
            me: true
        venue: "Master of Engineering Thesis, Massachusetts Institute of Technology"
        publisher: "Massachusetts Institute of Technology"
        schemaType: "Thesis"
        year: 2020
        summary: >-
          A deep learning model (NEMO) that uses natural language processing signals from
          public text to forecast commodity demand in long supply chains, where information
          sharing across firms is rarely feasible.
        keywords:
          - natural language processing
          - demand forecasting
          - supply chain
          - deep learning
        links:
          - label: Thesis
            url: "https://dspace.mit.edu/handle/1721.1/127104"
