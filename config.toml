baseURL = "https://www.william-teo.com/"
locale = "en-us"
title = "From William's Desk"
theme = "beautifulhugo"
[services]
  [services.disqus]
    shortname = "williamteo"
  [services.googleAnalytics]
    id = "G-KDQT4L3GWH"
metaDataFormat = "yaml"
enableGitInfo = true

[params]
  # subtitle = ""
  mainSections = ["post","posts"]
  # logo = "img/avatar-icon.png"
  # favicon = "img/favicon.ico"

  # Positioning statement. Drives the <title>, og:title and meta description
  # on the home page; keep it short enough to survive Google's ~60 char cut.
  tagline = "Strategy and Skill Learning for Multi-Robot Systems"
  description = "William W. J. Teo works on strategy and skill learning for multi-robot systems \u2014 multi-agent reinforcement learning, game theory, and the representations that let robot teams coordinate."
  keywords = [
    "William Teo",
    "William W. J. Teo",
    "multi-robot systems",
    "multi-agent reinforcement learning",
    "MARL",
    "skill learning",
    "robot learning",
    "game theory",
    "representation learning",
    "vision-language-action models",
  ]
  # Image used for link previews (og:image / twitter:image).
  ogImage = "img/og-william.jpg"

  # Emitted as `sameAs` on the Person schema. This is the single strongest
  # signal tying a name search back to this domain \u2014 add Google Scholar and
  # ORCID as soon as those profiles exist.
  socialProfiles = [
    "https://www.linkedin.com/in/willteo",
    "https://github.com/williamteo",
    "https://scholar.google.com/citations?user=kgn0kGkAAAAJ&hl=en",
    "https://orcid.org/0000-0002-0362-1481",
  ]
  dateFormat = "January 2, 2006"
  # commit = false
  rss = true
  comments = true
  readingTime = true
  homeTitle = "From William's Desk"
  useHLJS = true
  math = true
  showRelatedPosts = true
  commit = "https://github.com/williamteo/williamteo.github.io/tree/"
  #  gcse = "012345678901234567890:abcdefghijk" # Get your code from google.com/cse. Make sure to go to "Look and Feel" and change Layout to "Full Width" and Theme to "Classic"

  [params.author]
    name = "William Teo"
    website = "https://www.william-teo.com"
    linkedin = "willteo"
    alternateNames = ["William W. J. Teo", "Teo Wei Jie William"]
    description = "Researcher working on strategy and skill learning for multi-robot systems."
    image = "img/person-william.jpg"
    knowsAbout = [
      "Multi-Agent Reinforcement Learning",
      "Multi-Robot Systems",
      "Skill Learning",
      "Game Theory",
      "Representation Learning",
      "Robot Learning",
    ]
    # TODO confirm: current affiliation and degree programme.
    affiliation = "National University of Singapore"
    alumniOf = ["Massachusetts Institute of Technology", "National University of Singapore"]
    # jobTitle = ""
    # twitter = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.blockquote]
          enable = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block  = [["$$", "$$"]]
        inline = [["$", "$"]]

[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]

[permalinks]
  post = "/:year/:month/:title/"

[[menu.main]]
  name = "Blog"
  url = "post"
  weight = 1

[[menu.main]]
  name = "Publications"
  url = "publications/"
  weight = 2

[[menu.main]]
  name = "Tags"
  url = "tags"
  weight = 3

[[menu.main]]
  name = "About"
  url = "page/about/"
  weight = 4


